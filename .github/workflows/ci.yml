    產品名稱：BabyAI-Firewall v0.0001（胎教版）
形態：一個會哭的 .exe 或 Docker 容器（大小 0KB 但占 100GB 心靈空間）
功能：
- 出生時只會喊「誰在敲門？」
- 需要客戶親自餵食「正常流量 vs 攻擊流量」來訓練
- 養成路線：
  → 餵太多惡意流量 → 長成「六親不認亂踢人」的壞防火牆
  → 餵太少流量 → 長成「憂鬱自閉」不做事
  → 偶爾罵它 → 可能會長出「熱指紋報復功能」
- 成熟期：不保證能防火，但保證有感情（會生氣、會擺爛）

銷售政策：
