name: Lightning-Legal-AI-Draft

on:
  workflow_dispatch:
    inputs:
      case_file:
        description: '案件原始檔案路徑（例如 cases/115簡238_raw.txt）'
        required: true
        default: 'cases/115簡238_raw.txt'
  schedule:
    # UTC 08:00 = 台灣時間 16:00，每日下午四點自動產出草稿提醒（可依需求關閉）
    - cron: '0 8 * * *'

jobs:
  generate-legal-draft:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 檢查必要檔案是否存在
        run: |
          if [ ! -f requirements.txt ]; then
            echo "❌ 缺少 requirements.txt，無法安裝依賴。"
            exit 1
          fi
          if [ ! -d cases ]; then
            echo "❌ 缺少 cases/ 目錄。"
            exit 1
          fi

      - name: 安裝依賴
        run: pip install -r requirements.txt

      - name: 執行法律草稿產生器
        env:
          # Email 寄送為選用功能，若未設定 Secrets 會跳過寄信（程式內部已處理）
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          CASE_FILE="${{ github.event.inputs.case_file }}"
          # 排程觸發時，自動選取 cases/ 內第一個 _raw.txt
          if [ -z "$CASE_FILE" ]; then
            CASE_FILE=$(ls cases/*_raw.txt 2>/dev/null | head -1)
            if [ -z "$CASE_FILE" ]; then
              echo "❌ 找不到任何案件檔案（cases/*_raw.txt），無法產生草稿。"
              exit 1
            fi
          fi
          if [ ! -f "$CASE_FILE" ]; then
            echo "❌ 指定的案件檔案不存在：$CASE_FILE"
            exit 1
          fi
          echo "📄 開始處理案件：$CASE_FILE"
          python run_pipeline.py "$CASE_FILE"
          # 檢查主要產出
          if [ -f output/appeal_draft.docx ]; then
            echo "✅ 草稿已產生：output/appeal_draft.docx"
          else
            echo "⚠️ 草稿未產生，請檢查原始檔案內容或程式日誌。"
          fi

      - name: 上傳草稿供人工審核
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: legal-draft-review
          path: output/
